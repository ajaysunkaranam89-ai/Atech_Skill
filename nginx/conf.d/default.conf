# A TechSkills Academy – Nginx reverse proxy (HTTP).
# For HTTPS, follow docs/DEPLOYMENT.md §6 (copy nginx/ssl.conf.example over this file).

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2100m;          # large MP4 uploads (MAX_VIDEO_UPLOAD_MB + overhead)
    client_body_timeout 600s;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Public media only (thumbnails, logo). Paid videos/PDFs live in private_media.
    location /media/ {
        alias /app/media/;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Private files: only reachable through Django's X-Accel-Redirect after a permission check.
    location /protected/ {
        internal;
        alias /app/private_media/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
