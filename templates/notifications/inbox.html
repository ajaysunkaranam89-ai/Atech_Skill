{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:860px">
  <div class="d-flex align-items-center mb-3">
    <h1 class="h3 section-title mb-0 me-auto">Notifications</h1>
    <form method="post" action="{% url 'notifications:read_all' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Mark all as read</button></form>
  </div>
  <div class="list-group">
    {% for n in page.object_list %}
    <form method="post" action="{% url 'notifications:open' n.pk %}" class="list-group-item list-group-item-action p-0 {% if not n.is_read %}border-start border-4 border-info{% endif %}">{% csrf_token %}
      <button class="btn w-100 text-start p-3">
        <div class="d-flex"><strong class="me-auto">{{ n.title }}</strong><span class="small text-muted">{{ n.created_at|timesince }} ago</span></div>
        {% if n.message %}<div class="small text-muted" style="white-space:pre-line">{{ n.message }}</div>{% endif %}
      </button>
    </form>
    {% empty %}<div class="list-group-item text-muted">No notifications yet.</div>{% endfor %}
  </div>
  {% include "partials/pagination.html" with p=page %}
</div>
{% endblock %}
