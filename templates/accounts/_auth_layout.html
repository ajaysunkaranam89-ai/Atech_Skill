{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4"><img src="{% static 'img/logo-full.png' %}" alt="{{ academy.site_name }}" class="img-fluid auth-logo">
            <h1 class="h4 mt-3 mb-1">{% block heading %}{% endblock %}</h1>
            <p class="text-muted small mb-0">{% block subheading %}{{ academy.tagline }}{% endblock %}</p></div>
          {% block form %}{% endblock %}
        </div>
      </div>
      {% block below %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
