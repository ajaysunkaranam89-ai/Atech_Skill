{% if form.non_field_errors %}
<div class="alert alert-danger">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>
{% elif form.errors %}
<div class="alert alert-warning py-2 small"><i class="bi bi-exclamation-triangle me-1"></i>Please correct the highlighted fields.</div>
{% endif %}
