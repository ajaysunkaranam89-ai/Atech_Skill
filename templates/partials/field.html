{% load lms %}
<div class="mb-3" data-field="{{ field.name }}">
  {% if field|widget_type == "checkbox" %}
    <div class="form-check form-switch">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% else %}
    <label class="form-label fw-medium" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
