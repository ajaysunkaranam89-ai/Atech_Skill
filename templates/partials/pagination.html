{% load lms %}
{% if p.has_other_pages %}
<nav aria-label="Pagination" class="mt-3">
  <ul class="pagination pagination-sm justify-content-center mb-0">
    {% if p.has_previous %}<li class="page-item"><a class="page-link" href="?{% qs_replace page=1 %}">« First</a></li><li class="page-item"><a class="page-link" href="?{% qs_replace page=p.previous_page_number %}">‹ Prev</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ p.number }} of {{ p.paginator.num_pages }}</span></li>
    {% if p.has_next %}<li class="page-item"><a class="page-link" href="?{% qs_replace page=p.next_page_number %}">Next ›</a></li><li class="page-item"><a class="page-link" href="?{% qs_replace page=p.paginator.num_pages %}">Last »</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
