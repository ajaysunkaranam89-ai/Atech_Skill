name: techskills

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build: .
    image: techskills-academy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
      USE_X_ACCEL_REDIRECT: "1"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - private_media:/app/private_media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend]

volumes:
  pg_data:
  static_data:
  media_data:
  private_media:

networks:
  backend:
  frontend:
